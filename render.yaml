services:
  - type: web
    name: zoryvena-perfumes
    runtime: static
    buildCommand: bash render-build.sh
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://sdk.mercadopago.com https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com;
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob: https://ajyultndtauabfufrmfr.supabase.co https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com;
          connect-src 'self' https://ajyultndtauabfufrmfr.supabase.co wss://ajyultndtauabfufrmfr.supabase.co https://viacep.com.br https://api.mercadopago.com https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com;
          frame-src https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com;
          worker-src 'self' blob:;
          font-src 'self' data:;
          media-src 'self';
          manifest-src 'self';
          object-src 'none';
          base-uri 'self';
          form-action 'self' https://*.mercadopago.com;
          frame-ancestors 'none';
          upgrade-insecure-requests
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), accelerometer=(), gyroscope=(), magnetometer=(), usb=(), serial=(), bluetooth=(), browsing-topics=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /*
        name: X-Download-Options
        value: noopen
      - path: /*
        name: X-XSS-Protection
        value: "0"
      - path: /admin/*
        name: Cache-Control
        value: no-store, max-age=0
      - path: /checkout.html
        name: Cache-Control
        value: no-store, max-age=0
      - path: /cartao.html
        name: Cache-Control
        value: no-store, max-age=0
      - path: /pagamento.html
        name: Cache-Control
        value: no-store, max-age=0
      - path: /carrinho.html
        name: Cache-Control
        value: no-store, max-age=0
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400, must-revalidate
